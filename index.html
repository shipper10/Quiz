<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الأسئلة الدراسية</title>
<meta name="description" content="Interactive study platform: practice questions by year, semester and subject.">
<meta name="theme-color" content="#1f6b4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/app.css">
<script>
  /* apply saved language/theme before first paint (no flash) */
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('quizhub:settings') || '{}');
      var lang = s.lang === 'en' ? 'en' : 'ar';
      var theme = s.theme || 'auto';
      if (theme === 'auto') theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var d = document.documentElement;
      d.lang = lang; d.dir = lang === 'ar' ? 'rtl' : 'ltr'; d.dataset.theme = theme;
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app"><p style="padding:24px">…</p></div>
<noscript><p style="padding:24px">This site needs JavaScript. / هذا الموقع يحتاج تفعيل JavaScript.</p></noscript>

<!-- core -->
<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/drafts.js"></script>
<script src="js/content.js"></script>
<script src="js/ui/forms.js"></script>
<script src="js/ui/shell.js"></script>

<!-- question types: one file each. To add a type, add its file here. -->
<script src="js/types/registry.js"></script>
<script src="js/types/mcq.js"></script>
<script src="js/types/truefalse.js"></script>
<script src="js/types/multitf.js"></script>
<script src="js/types/matching.js"></script>
<script src="js/types/shortanswer.js"></script>
<script src="js/types/compare.js"></script>

<!-- pages -->
<script src="js/views/quiz.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/subject.js"></script>
<script src="js/views/browse.js"></script>
<script src="js/views/settings.js"></script>

<!-- editor -->
<script src="js/editor/images.js"></script>
<script src="js/editor/publish.js"></script>
<script src="js/editor/data.js"></script>
<script src="js/editor/editor-main.js"></script>
<script src="js/editor/editor-subject.js"></script>
<script src="js/editor/editor-question.js"></script>

<script src="js/main.js"></script>
</body>
</html>
